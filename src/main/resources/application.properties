server.port=0

# ===== 元数据库（版本/计划/步骤状态/回填进度/租约/审计），本地嵌入式 H2 =====
migration.metadata.jdbc-url=jdbc:h2:file:./data/metadata;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
migration.metadata.driver-class-name=org.h2.Driver
migration.metadata.username=sa
migration.metadata.password=

# ===== 被迁移的目标库，本地嵌入式 H2 =====
migration.target.jdbc-url=jdbc:h2:file:./data/target;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
migration.target.driver-class-name=org.h2.Driver
migration.target.username=sa
migration.target.password=

# ===== 回填节奏控制 =====
migration.backfill.batch-size=1000
migration.backfill.batch-delay-ms=50
migration.backfill.max-batches=0

# ===== 租约 =====
migration.lease.ttl-ms=30000
migration.lease.renew-interval-ms=5000
migration.lease.max-wait-ms=0

# ===== 审计 =====
migration.audit.enabled=true
