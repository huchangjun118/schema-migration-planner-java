server.port=8080

# Embedded local H2: holds both business tables and the sm_* metastore.
spring.datasource.url=jdbc:h2:file:${user.home}/.schema-migration-planner/data;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Migration engine configuration
migration.lease-ttl-millis=30000
migration.lease-renew-millis=10000
migration.backfill.batch-size=500
migration.backfill.batch-interval-millis=50

# Local authorization: actor -> roles (PLAN, APPLY, ROLLBACK, ADMIN)
migration.users.alice=ADMIN
migration.users.bob=PLAN,APPLY
migration.users.carol=PLAN
